name: Daily reel

on:
  # CRON ĐÃ TẮT — đã chuyển tự đăng sang daily-reel-v2.yml (pipeline scenes.json,
  # render đẹp hơn). Giữ lại workflow_dispatch để chạy tay dự phòng khi cần.
  # schedule:
  #   - cron: '15 1 * * *'    # 08:15 VN
  #   - cron: '15 5 * * *'    # 12:15 VN
  #   - cron: '15 13 * * *'   # 20:15 VN
  workflow_dispatch:
    inputs:
      product_id:
        description: 'Ép quay 1 sản phẩm cụ thể (bỏ trống = script tự chọn)'
        required: false
      dry_run:
        description: 'true = chỉ render, không đăng'
        required: false
        default: 'true'
      force:
        description: 'true = bỏ qua chốt chặn, đăng dù hôm nay đã đăng'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Chặn ngay đây, trước khi tốn 3 phút cài Chrome và FFmpeg.
      - name: Đủ giãn cách chưa (>= 5.5h)
        id: guard
        run: node lib/already-posted.mjs

      - name: Bỏ qua
        if: steps.guard.outputs.skip == 'true' && inputs.force != 'true'
        run: echo "::notice::Chưa đủ giãn cách từ lần đăng trước. Nhịp cron này nghỉ."

      - name: Cài dependency
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: npm ci || npm install

      - name: Cài FFmpeg và chrome-headless-shell
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          OUT=$(npx --yes @puppeteer/browsers install chrome-headless-shell@stable)
          echo "$OUT"
          BIN=$(echo "$OUT" | awk '{print $2}')
          if [ -x "$BIN" ]; then echo "HYPERFRAMES_BROWSER_PATH=$BIN" >> "$GITHUB_ENV"; fi

      - name: Kiểm tra môi trường render
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: npx --yes hyperframes@0.7.42 doctor

      - name: Chọn sản phẩm
        id: pick
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: node lib/pick-daily.mjs ${{ inputs.product_id }}

      - name: Kéo dữ liệu từ Store API
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: node lib/fetch-product.mjs ${{ steps.pick.outputs.id }} build

      - name: Ghép template (+ AI viết nội dung, màu & giọng đọc)
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COPY: ${{ vars.AI_COPY || 'true' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-opus-4-8' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ vars.ELEVEN_VOICE_ID }}   # để trống = random trong pool config.json; đặt để ghim 1 giọng
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL || 'eleven_v3' }}
          VOICE: ${{ vars.VOICE || 'true' }}
        run: node lib/build.mjs build

      - name: Lint composition
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: npx --yes hyperframes@0.7.42 lint build

      - name: Validate trong headless Chrome
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: npx --yes hyperframes@0.7.42 validate build

      - name: Render MP4
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: |
          mkdir -p renders
          npx --yes hyperframes@0.7.42 render build \
            -o renders/reel.mp4 -f 30 -q high --strict --quiet

      - name: Xuất ảnh bìa
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: npx --yes hyperframes@0.7.42 snapshot build || echo "snapshot lỗi, bỏ qua"

      - name: Kiểm tra file xuất ra
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        run: |
          test -f renders/reel.mp4 || { echo "Không có MP4"; exit 1; }
          SIZE=$(stat -c%s renders/reel.mp4)
          echo "MP4 $((SIZE/1024)) KB"
          [ "$SIZE" -gt 200000 ] || { echo "MP4 nhỏ bất thường, nghi render hỏng"; exit 1; }
          echo "luồng trong file:"
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 renders/reel.mp4 | sort -u
          if [ -f assets/bgm.mp4 ]; then
            V=$(ffprobe -v error -show_entries format=duration -of csv=p=0 renders/reel.mp4)
            A=$(ffprobe -v error -show_entries format=duration -of csv=p=0 assets/bgm.mp4)
            echo "video ${V}s | nhạc ${A}s"
            awk -v v="$V" -v a="$A" 'BEGIN{ if (a+0 < v+0-0.2) print "::warning::Nhạc ngắn hơn video, đoạn cuối sẽ câm" }'
          fi

      - name: Lưu artifact để xem trước
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.pick.outputs.id }}
          path: |
            renders/
            snapshots/
            build/index.html
          retention-days: 14

      - name: Đăng lên fanpage + comment link mua
        if: steps.guard.outputs.skip != 'true' || inputs.force == 'true'
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || 'true' }}
        run: node lib/post-reel.mjs renders/reel.mp4

      # VÒNG TỰ HỌC: kéo tương tác các reel đã đăng -> Claude rút bài học ->
      # learnings.txt (được lib/ai-copy.mjs nhồi lại vào prompt lần sau).
      - name: Đồng bộ tương tác + rút bài học
        if: |
          (steps.guard.outputs.skip != 'true' || inputs.force == 'true') &&
          (inputs.dry_run || vars.DRY_RUN || 'true') != 'true'
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-opus-4-8' }}
        run: |
          node scripts/sync-insights.mjs
          node scripts/optimize.mjs

      # Chỉ ghi sổ khi đã đăng thật. Hỏng giữa chừng thì hôm nay vẫn trống,
      # nhịp cron sau được phép chạy lại.
      - name: Ghi lại sản phẩm đã quay
        if: |
          (steps.guard.outputs.skip != 'true' || inputs.force == 'true') &&
          (inputs.dry_run || vars.DRY_RUN || 'true') != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in history.json reels_history.json learnings.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet && exit 0
          git commit -m "chore: đã quay reel + cập nhật bài học $(date -u +%F)"
          git pull --rebase
          git push
