name: TikTok KPI Monthly Check

on:
  schedule:
    - cron: '0 1 1 * *'  # 08:00 VN, ngày 1 mỗi tháng
  workflow_dispatch:        # cho phép chạy tay để test

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chấm điểm & lưu lịch sử
        run: node tiktok-kpi/check.mjs

      - name: Commit lịch sử mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiktok-kpi/history_*.json tiktok-kpi/config.json
          git diff --staged --quiet || git commit -m "chore: chấm điểm KPI TikTok tháng $(date +%Y-%m) [skip ci]"
          git push
