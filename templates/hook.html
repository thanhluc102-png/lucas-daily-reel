<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070B16; }
      body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

      /* ---- nền: lưới + hai vũng sáng ---- */
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(120% 70% at 50% -6%, #16224a 0%, rgba(11,18,36,0) 55%),
          radial-gradient(90% 55% at 50% 116%, #1a1330 0%, rgba(7,11,22,0) 60%),
          linear-gradient(180deg, #070B16 0%, #0B1224 100%);
      }
      #grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(120,150,220,0.10) 2px, transparent 2px),
          linear-gradient(90deg, rgba(120,150,220,0.10) 2px, transparent 2px);
        background-size: 68px 68px;
        -webkit-mask-image: radial-gradient(120% 85% at 50% 32%, #000 42%, transparent 92%);
                mask-image: radial-gradient(120% 85% at 50% 32%, #000 42%, transparent 92%);
      }

      /* ---- thanh tiến trình + thương hiệu (hiện suốt clip) ---- */
      #prog { position: absolute; top: 40px; left: 60px; right: 60px; display: flex; gap: 12px; z-index: 6; }
      #prog .seg { flex: 1; height: 7px; border-radius: 7px; background: rgba(255,255,255,0.16); overflow: hidden; }
      #prog .seg .f { width: 0%; height: 100%; background: #FBBF24; border-radius: 7px; }
      #brand {
        position: absolute; top: 72px; left: 62px; z-index: 6;
        color: #34D399; font-size: 40px; font-weight: 700; letter-spacing: 1px;
        display: flex; align-items: center; gap: 8px;
      }
      #brand .caret { width: 14px; height: 44px; background: #34D399; box-shadow: 0 0 16px #34D399; display: inline-block; }

      .clip {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        /* 346px dưới là vùng Reels đắp caption + nút chia sẻ. Chừa trống. */
        padding: 200px 96px 346px;
        text-align: center;
      }

      /* ---- cảnh 1: hook ---- */
      .pill {
        display: inline-flex; align-items: center; gap: 20px;
        background-color: #FBBF24;
        background-image: linear-gradient(180deg, #FDE68A, #FBBF24);
        color: #1a1204; font-size: 42px; font-weight: 700;
        padding: 24px 50px; border-radius: 80px;
        box-shadow: 0 16px 40px -14px rgba(251,191,36,0.7);
      }
      .pill .dot { width: 20px; height: 20px; border-radius: 50%; background: #1a1204; }
      #s1-hl { color: #EAF0FF; font-size: 116px; font-weight: 800; line-height: 1.06; letter-spacing: -2px; margin-top: 76px; }
      .pain { color: #93A0BE; position: relative; white-space: nowrap; }
      #strike {
        position: absolute; left: -12px; top: 52%; height: 14px; width: calc(100% + 24px);
        background: #FF5460; border-radius: 8px; transform-origin: left center;
      }
      #s1-punch { color: #FBBF24; font-size: 124px; font-weight: 800; line-height: 1.04; letter-spacing: -2px; margin-top: 90px; text-shadow: 0 0 44px rgba(251,191,36,0.4); }

      /* ---- ô ảnh sáng ---- */
      .card {
        width: 620px; height: 620px; border-radius: 52px;
        background: radial-gradient(120% 120% at 50% 18%, #F5F7FC, #E7ECF6);
        display: flex; align-items: center; justify-content: center; overflow: hidden;
        box-shadow: 0 40px 90px -30px rgba(0,0,0,0.7), inset 0 2px 0 rgba(255,255,255,0.8);
      }
      .card img { width: 90%; height: 90%; object-fit: contain; }

      /* ---- chip thông số ---- */
      #stats { display: flex; gap: 34px; margin-top: 84px; }
      .chip {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 30px 44px; border-radius: 28px;
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        border: 3px solid rgba(251,191,36,0.20);
      }
      .chip .v { color: #FBBF24; font-size: 78px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
      .chip .k { color: #93A0BE; font-size: 34px; font-weight: 500; letter-spacing: 3px; }

      .anglechip {
        display: inline-flex; align-items: center; gap: 20px; margin-top: 80px;
        background: rgba(255,255,255,0.05); border: 3px solid rgba(251,191,36,0.22);
        color: #DBE4FB; font-size: 44px; font-weight: 600; padding: 24px 48px; border-radius: 80px;
      }
      .anglechip .dot { width: 18px; height: 18px; border-radius: 50%; background: #FBBF24; }

      /* ---- cảnh giá ---- */
      #s5-coupon {
        display: inline-flex; align-items: center; gap: 20px;
        background: rgba(255,84,96,0.12); border: 3px solid rgba(255,84,96,0.4);
        color: #FF8A93; font-size: 44px; font-weight: 600; padding: 22px 48px; border-radius: 80px;
      }
      #s5-coupon .dot { width: 18px; height: 18px; border-radius: 50%; background: #FF5460; }
      #was { color: #93A0BE; font-size: 66px; font-weight: 500; text-decoration: line-through; margin-top: 84px; }
      #now { color: #FF5460; font-size: 184px; font-weight: 800; letter-spacing: -6px; margin: 6px 0 76px; text-shadow: 0 0 50px rgba(255,84,96,0.35); }
      #cta {
        background-color: #FBBF24;
        background-image: linear-gradient(180deg, #FDE68A, #FBBF24); color: #0a0d16;
        font-size: 56px; font-weight: 800; padding: 44px 92px; border-radius: 40px;
        box-shadow: 0 20px 54px -14px rgba(251,191,36,0.8);
      }
      #s5-name { color: #93A0BE; font-size: 38px; font-weight: 400; margin-top: 42px; max-width: 820px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.769" data-fps="30" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="grid"></div>

      <div id="prog">
        <div class="seg" id="seg-0"><div class="f"></div></div>
        <div class="seg" id="seg-1"><div class="f"></div></div>
        <div class="seg" id="seg-2"><div class="f"></div></div>
        <div class="seg" id="seg-3"><div class="f"></div></div>
        <div class="seg" id="seg-4"><div class="f"></div></div>
      </div>
      <div id="brand">&gt;lucas.vn<span class="caret"></span></div>

      <div class="clip" id="scene-hook" data-start="0.0" data-duration="3.692" data-track-index="0">
        <div class="pill" id="s1-pill"><span class="dot"></span>{{PILL}}</div>
        <div id="s1-hl">{{HEADLINE}} <span class="pain">{{PAIN}}<span id="strike"></span></span></div>
        <div id="s1-punch">{{PUNCH}}</div>
      </div>

      <div class="clip" id="scene-product" data-start="3.692" data-duration="2.462" data-track-index="0">
        <div class="card"><img id="s2-img" src="{{IMAGE1}}" alt="" /></div>
        <div id="stats">
          <div class="chip"><div class="v">{{SPEC1_V}}</div><div class="k">{{SPEC1_K}}</div></div>
          <div class="chip"><div class="v">{{SPEC2_V}}</div><div class="k">{{SPEC2_K}}</div></div>
        </div>
      </div>

      <div class="clip" id="scene-angle-2" data-start="6.154" data-duration="2.461" data-track-index="0">
        <div class="card"><img id="s3-img" src="{{IMAGE2}}" alt="" /></div>
        <div class="anglechip" id="s3-chip"><span class="dot"></span>{{SPEC3_K}} · {{SPEC3_V}}</div>
      </div>

      <div class="clip" id="scene-angle-3" data-start="8.615" data-duration="2.462" data-track-index="0">
        <div class="card"><img id="s4-img" src="{{IMAGE3}}" alt="" /></div>
        <div class="anglechip" id="s4-chip"><span class="dot"></span>{{SPEC4_K}} · {{SPEC4_V}}</div>
      </div>

      <div class="clip" id="scene-offer" data-start="11.077" data-duration="3.692" data-track-index="0">
        <div id="s5-coupon"><span class="dot"></span>Nhập {{COUPON}}</div>
        <div id="was">{{REGULAR_PRICE}}</div>
        <div id="now">{{PRICE}}</div>
        <div id="cta">Mua tại lucas.vn</div>
        <div id="s5-name">{{NAME}}</div>
      </div>

      <!--AUDIO-->

      <script>
        const tl = gsap.timeline({ paused: true });
        const slow = 'power2.out';

        // Thanh tiến trình từng cảnh (story-style) — nền dài suốt clip.
        const segs = [[0,3.692],[3.692,2.462],[6.154,2.461],[8.615,2.462],[11.077,3.692]];
        segs.forEach(([s, d], i) => {
          tl.fromTo(`#seg-${i} .f`, { width: '0%' }, { width: '100%', duration: d, ease: 'none' }, s);
        });

        // Cảnh 1 — hook. Gạch đỏ là nhịp trống, vẽ ở ~giây 1.2.
        tl.from('#s1-pill',  { opacity: 0, y: 40, duration: 0.45 }, 0.154);
        tl.from('#s1-hl',    { opacity: 0, y: 48, duration: 0.55 }, 0.615);
        tl.fromTo('#strike', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: slow }, 1.231);
        tl.from('#s1-punch', { opacity: 0, y: 56, scale: 0.92, duration: 0.5, ease: 'back.out(1.6)' }, 2.462);

        // Cảnh 2 — ảnh chính + 2 chip, đẩy nhẹ suốt cảnh.
        tl.from('#scene-product .card', { opacity: 0, y: 40, scale: 0.9, duration: 0.55, ease: slow }, 3.752);
        tl.to('#s2-img', { scale: 1.06, duration: 2.462, ease: 'none' }, 3.752);
        tl.from('#stats .chip', { opacity: 0, y: 36, duration: 0.4, stagger: 0.28 }, 4.3);

        // Cảnh 3 & 4 — hai góc chụp, trượt ngang ngược chiều.
        tl.from('#scene-angle-2 .card', { opacity: 0, x: 100, duration: 0.5, ease: slow }, 6.214);
        tl.to('#s3-img', { scale: 1.06, duration: 2.461, ease: 'none' }, 6.214);
        tl.from('#s3-chip', { opacity: 0, y: 30, duration: 0.4 }, 6.5);

        tl.from('#scene-angle-3 .card', { opacity: 0, x: -100, duration: 0.5, ease: slow }, 8.675);
        tl.to('#s4-img', { scale: 1.06, duration: 2.462, ease: 'none' }, 8.675);
        tl.from('#s4-chip', { opacity: 0, y: 30, duration: 0.4 }, 8.96);

        // Cảnh 5 — giá.
        tl.from('#s5-coupon', { opacity: 0, y: 32, duration: 0.4 }, 11.137);
        tl.from('#was',       { opacity: 0, duration: 0.3 }, 11.4);
        tl.from('#now',       { opacity: 0, scale: 0.9, duration: 0.45, ease: 'back.out(1.5)' }, 11.7);
        tl.from('#cta',       { opacity: 0, y: 32, duration: 0.4 }, 12.3);
        tl.from('#s5-name',   { opacity: 0, duration: 0.35 }, 12.6);

        window.__timelines = window.__timelines || {};
        window.__timelines.main = tl;
      </script>
    </div>
  </body>
</html>
