<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a12; }
      body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

      #grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.04) 2px, transparent 2px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 2px, transparent 2px);
        background-size: 122px 122px;
      }
      .glow { position: absolute; left: 50%; transform: translateX(-50%); }
      #glow-top    { top: -170px;    width: 1080px; height: 940px; background: radial-gradient(circle, rgba(24,144,192,0.20) 0%, transparent 70%); }
      #glow-bottom { bottom: -200px; width: 1150px; height: 1010px; background: radial-gradient(circle, rgba(0,120,168,0.18) 0%, transparent 70%); }

      .clip {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        /* 346px dưới là vùng Reels đắp caption + nút chia sẻ lên. Không đặt gì vào đó. */
        padding: 94px 94px 346px;
        text-align: center;
      }

      .pill {
        display: inline-flex; align-items: center; gap: 22px;
        background: #0c2233; border: 3px solid rgba(24,144,192,0.4);
        color: #48a8f0; font-size: 43px; font-weight: 500;
        padding: 26px 52px; border-radius: 80px;
      }
      .dot { width: 20px; height: 20px; border-radius: 50%; background: #48a8f0; }

      #s1-hl { color: #f5f5f7; font-size: 112px; font-weight: 700; line-height: 1.08; letter-spacing: -2px; margin-top: 72px; }
      .pain { color: #8b8ba7; position: relative; white-space: nowrap; }
      #strike {
        position: absolute; left: -10px; top: 50%; height: 14px; width: calc(100% + 20px);
        background: #f43f5e; border-radius: 8px; transform-origin: left center;
      }
      #s1-punch { color: #48a8f0; font-size: 119px; font-weight: 800; line-height: 1.05; letter-spacing: -2px; margin-top: 94px; }

      .tile {
        width: 620px; height: 620px; border-radius: 56px; background: #ffffff;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
      }
      .tile img { width: 100%; height: 100%; object-fit: contain; }

      #stats { display: flex; gap: 80px; margin-top: 94px; }
      .stat { color: #f5f5f7; font-size: 144px; font-weight: 800; letter-spacing: -4px; line-height: 1; }
      .stat .u { font-size: 72px; }
      .slab { color: #6b7280; font-size: 40px; letter-spacing: 5px; margin-top: 18px; }

      #was { color: #8b8ba7; font-size: 68px; font-weight: 500; text-decoration: line-through; margin-top: 94px; }
      #now { color: #f5f5f7; font-size: 173px; font-weight: 800; letter-spacing: -5px; margin: 8px 0 80px; }
      #cta { background: #48a8f0; color: #062033; font-size: 54px; font-weight: 700; padding: 47px 94px; border-radius: 43px; }
      #s5-name { color: #6b7280; font-size: 38px; font-weight: 400; margin-top: 40px; max-width: 800px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.769" data-fps="30" data-width="1080" data-height="1920">
      <div id="grid"></div>
      <div id="glow-top" class="glow"></div>
      <div id="glow-bottom" class="glow"></div>

      <div class="clip" id="scene-hook" data-start="0.0" data-duration="3.692" data-track-index="0">
        <div class="pill" id="s1-pill"><span class="dot"></span>{{PILL}}</div>
        <div id="s1-hl">{{HEADLINE}} <span class="pain">{{PAIN}}<span id="strike"></span></span></div>
        <div id="s1-punch">{{PUNCH}}</div>
      </div>

      <div class="clip" id="scene-product" data-start="3.692" data-duration="2.462" data-track-index="0">
        <div class="tile"><img id="s2-img" src="{{IMAGE1}}" alt="" /></div>
        <div id="stats">
          <div class="s"><div class="stat">{{SPEC1_V}}</div><div class="slab">{{SPEC1_K}}</div></div>
          <div class="s"><div class="stat" style="color:#48a8f0">{{SPEC2_V}}</div><div class="slab">{{SPEC2_K}}</div></div>
        </div>
      </div>

      <div class="clip" id="scene-angle-2" data-start="6.154" data-duration="2.461" data-track-index="0">
        <div class="tile"><img id="s3-img" src="{{IMAGE2}}" alt="" /></div>
        <div class="pill" id="s3-chip" style="margin-top:80px"><span class="dot"></span>{{SPEC3_K}} · {{SPEC3_V}}</div>
      </div>

      <div class="clip" id="scene-angle-3" data-start="8.615" data-duration="2.462" data-track-index="0">
        <div class="tile"><img id="s4-img" src="{{IMAGE3}}" alt="" /></div>
        <div class="pill" id="s4-chip" style="margin-top:80px"><span class="dot"></span>{{SPEC4_K}} · {{SPEC4_V}}</div>
      </div>

      <div class="clip" id="scene-offer" data-start="11.077" data-duration="3.692" data-track-index="0">
        <div class="pill" id="s5-pill" style="background:#1b1024;border-color:rgba(244,63,94,0.35);color:#fb7185">
          <span class="dot" style="background:#fb7185"></span>Nhập {{COUPON}}
        </div>
        <div id="was">{{REGULAR_PRICE}}</div>
        <div id="now">{{PRICE}}</div>
        <div id="cta">Mua tại lucas.vn</div>
        <div id="s5-name">{{NAME}}</div>
      </div>

      <!--AUDIO-->

      <script>
        const tl = gsap.timeline({ paused: true });

        // Cảnh 1 — hook. Gạch ngang là nhịp trống, vẽ ở giây 1.5.
        tl.from('#s1-pill',  { opacity: 0, y: 40, duration: 0.45 }, 0.154);
        tl.from('#s1-hl',    { opacity: 0, y: 48, duration: 0.55 }, 0.615);
        tl.fromTo('#strike', { scaleX: 0 }, { scaleX: 1, duration: 0.615, ease: 'power2.out' }, 1.231);
        tl.from('#s1-punch', { opacity: 0, y: 56, scale: 0.92, duration: 0.5, ease: 'back.out(1.6)' }, 2.462);

        // Cảnh 2 — ảnh chính, đẩy nhẹ suốt cảnh.
        tl.from('#s2-img', { opacity: 0, scale: 0.9, duration: 0.5, ease: 'power2.out' }, 3.752);
        tl.to('#s2-img',   { scale: 1.05, duration: 2.462, ease: 'none' }, 3.752);
        tl.from('#stats .s', { opacity: 0, y: 36, duration: 0.4, stagger: 0.308 }, 4.308);

        // Cảnh 3 và 4 — hai góc chụp khác, trượt ngang ngược chiều nhau.
        tl.from('#s3-img',  { opacity: 0, x: 90, duration: 0.5, ease: 'power2.out' }, 6.214);
        tl.from('#s3-chip', { opacity: 0, y: 30, duration: 0.4 }, 6.462);

        tl.from('#s4-img',  { opacity: 0, x: -90, duration: 0.5, ease: 'power2.out' }, 8.675);
        tl.from('#s4-chip', { opacity: 0, y: 30, duration: 0.4 }, 8.923);

        // Cảnh 5 — giá.
        tl.from('#s5-pill', { opacity: 0, y: 32, duration: 0.4 }, 11.137);
        tl.from('#was',     { opacity: 0, duration: 0.3 }, 11.385);
        tl.from('#now',     { opacity: 0, scale: 0.9, duration: 0.45, ease: 'back.out(1.5)' }, 11.692);
        tl.from('#cta',     { opacity: 0, y: 32, duration: 0.4 }, 12.308);
        tl.from('#s5-name', { opacity: 0, duration: 0.35 }, 12.615);

        window.__timelines = window.__timelines || {};
        window.__timelines.main = tl;
      </script>
    </div>
  </body>
</html>
